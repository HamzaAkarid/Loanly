<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in | LOANLY</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-light">
  <main class="min-vh-100 d-flex flex-column align-items-center justify-content-center p-3">
    <a class="navbar-brand fw-bold fs-3 mb-4 text-decoration-none text-body" href="index.html">LOAN<span>LY</span></a>
    <div class="card auth-card shadow-sm">
      <div class="card-body p-4 p-sm-5">
        <h1 class="h4 fw-bold mb-1">Welcome back</h1>
        <p class="text-secondary mb-4">Log in to see your loans and finances.</p>
        <form action="#" method="post">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required />
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between">
              <label for="password" class="form-label">Password</label>
              <a href="#" class="small">Forgot password?</a>
            </div>
            <input type="password" class="form-control" id="password" name="password" minlength="8" required />
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="remember" name="remember" />
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
        <p class="text-center text-secondary small mt-4 mb-0">
          Don't have an account? <a href="register.html">Sign up</a>
        </p>
      </div>
    </div>
    <a href="index.html" class="small text-secondary mt-4"><i class="bi bi-arrow-left me-1"></i>Back to home</a>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
